<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Brown Noise - Continuous Soother</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for Soothing Ambient Visualizer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090a10;
            color: #e2e8f0;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(18, 20, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .glass-button:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.14);
        }

        .preset-card.active {
            background: rgba(245, 158, 11, 0.22);
            border-color: rgba(245, 158, 11, 0.6);
            color: #fbbf24;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .visual-card.active {
            background: rgba(59, 130, 246, 0.22);
            border-color: rgba(59, 130, 246, 0.6);
            color: #93c5fd;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .timer-btn.active {
            background: rgba(245, 158, 11, 0.25);
            border-color: rgba(245, 158, 11, 0.6);
            color: #fbbf24;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            height: 8px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.95; }
        }

        .pulse-glow {
            animation: gentlePulse 5s infinite ease-in-out;
        }

        #night-overlay {
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between h-full w-full select-none">

    <!-- Canvas for 3D Three.js Ambient Visualizer -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- Screen Dimmer Overlay for Dark Nursery -->
    <div id="night-overlay" class="absolute inset-0 z-10 bg-black opacity-0 pointer-events-none"></div>

    <!-- Main Header Controls -->
    <header class="relative z-20 p-4 flex items-center justify-between glass-panel border-b-0 rounded-b-2xl mx-3 mt-3 transition-opacity duration-500">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-base sm:text-lg text-slate-100 tracking-wide leading-tight">Baby Brown Noise</h1>
                <p class="text-xs text-slate-400 font-medium" id="status-text">Ready • Tap anywhere to start</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Screen Dimmer Toggle -->
            <button id="dimmer-btn" class="glass-button p-2.5 rounded-xl text-slate-300 hover:text-white active:scale-95" title="Dim Screen">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
            <!-- Settings Modal Button -->
            <button id="config-btn" class="glass-button p-2.5 rounded-xl text-slate-300 hover:text-white active:scale-95" title="Sound Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Large Touch Zone -->
    <main id="main-touch-zone" class="relative z-20 flex-1 flex flex-col items-center justify-center cursor-pointer p-4 text-center transition-opacity duration-500">
        <div class="relative flex items-center justify-center">
            <!-- Outer Glow Ring -->
            <div id="play-ripple" class="absolute w-56 h-56 rounded-full border border-amber-500/20 pulse-glow"></div>
            
            <!-- Central Play/Pause Button -->
            <button id="big-play-btn" class="w-40 h-40 rounded-full glass-panel border-2 border-amber-500/40 flex flex-col items-center justify-center gap-2 shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95 bg-gradient-to-b from-amber-500/15 to-transparent">
                <svg id="play-icon" class="w-14 h-14 text-amber-400 translate-x-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pause-icon" class="w-14 h-14 text-amber-400 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span id="play-btn-label" class="text-xs font-bold uppercase tracking-wider text-amber-300">Play</span>
            </button>
        </div>

        <!-- Timer Countdown Display -->
        <div id="timer-display" class="mt-8 px-4 py-1.5 rounded-full glass-button text-xs text-amber-300 font-semibold tracking-wide hidden">
            Timer: <span id="timer-countdown">Infinite</span>
        </div>
    </main>

    <!-- Bottom Controls & Preset Selector -->
    <footer class="relative z-20 p-4 glass-panel rounded-t-3xl border-t-0 mx-2 mb-2 flex flex-col gap-4 transition-opacity duration-500">
        
        <!-- Preset Cards -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase px-1">Sound Texture</span>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button data-preset="super_deep" class="preset-card active glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-xs font-semibold">
                    <span>🌙</span> Super Deep
                </button>
                <button data-preset="womb" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-xs font-semibold">
                    <span>❤️</span> Womb Pulse
                </button>
                <button data-preset="velvet" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-xs font-semibold">
                    <span>☁️</span> Velvet Soft
                </button>
                <button data-preset="rain" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-xs font-semibold">
                    <span>🌧️</span> Soft Rain
                </button>
                <button data-preset="cosmic" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-xs font-semibold">
                    <span>🌌</span> Cosmic Rumble
                </button>
            </div>
        </div>

        <!-- Sleep Timer Buttons -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase px-1">Sleep Timer</span>
            <div class="grid grid-cols-5 gap-2">
                <button data-timer="off" class="timer-btn active glass-button py-2.5 rounded-xl text-xs font-bold text-amber-400 border-amber-500/40">∞</button>
                <button data-timer="15" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">15m</button>
                <button data-timer="30" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">30m</button>
                <button data-timer="60" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">1h</button>
                <button data-timer="480" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">8h</button>
            </div>
        </div>
    </footer>

    <!-- Config Settings Modal -->
    <div id="config-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 flex flex-col gap-5 border border-white/10">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <h3 class="text-base font-bold text-slate-100">Acoustic Settings</h3>
                <button id="close-config-btn" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Warmth / Lowpass Cutoff Slider -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between text-xs font-medium">
                    <span class="text-slate-300">Warmth (Cutoff)</span>
                    <span id="warmth-val" class="text-amber-400 font-semibold">280 Hz</span>
                </div>
                <input id="warmth-slider" type="range" min="80" max="450" value="280" class="w-full">
            </div>

            <!-- Sub-Bass Boost Slider -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between text-xs font-medium">
                    <span class="text-slate-300">Sub-Bass Shelf</span>
                    <span id="bass-val" class="text-amber-400 font-semibold">+2 dB</span>
                </div>
                <input id="bass-slider" type="range" min="0" max="10" value="2" class="w-full">
            </div>

            <!-- Master Volume Slider (Up to 300%) -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between text-xs font-medium">
                    <span class="text-slate-300">Volume Level</span>
                    <span id="volume-val" class="text-amber-400 font-semibold">140%</span>
                </div>
                <input id="volume-slider" type="range" min="0" max="300" value="140" class="w-full">
            </div>

            <div class="flex gap-2 mt-2">
                <button id="reset-config-btn" class="w-1/3 py-3 bg-white/10 hover:bg-white/20 text-slate-300 font-semibold rounded-2xl transition-all text-xs">
                    Reset
                </button>
                <button id="apply-config-btn" class="w-2/3 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-2xl transition-all text-sm">
                    Save & Close
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden audio element for lock screen media session background keepalive -->
    <audio id="background-audio-keepalive" loop class="hidden"></audio>

    <script>
        // Configure native audio session for background playback on iOS / iPadOS
        if ('audioSession' in navigator) {
            try {
                navigator.audioSession.type = "playback";
            } catch (e) {
                console.log("AudioSession type setup error:", e);
            }
        }

        // Web Audio Context & Nodes
        let audioCtx = null;
        let noiseSource = null;
        let lfoNode = null;
        let lfoGainNode = null;
        let presetFilter1 = null;
        let presetFilter2 = null;
        let presetModGain = null;
        let subsonicFilter = null;
        let lowpassFilter = null;
        let bassFilter = null;
        let masterGain = null;
        let compressor = null;
        let analyserNode = null;
        let audioDataArray = null;
        let brownNoiseBuffer = null;

        let isPlaying = false;
        let isDimmed = false;
        let currentPreset = 'super_deep';
        let timerMinutes = 'off';
        let timerInterval = null;
        let timerEndTime = null;

        // Sound Settings Defaults - Optimized for high volume without speaker scratches
        let currentWarmth = 280; // Hz
        let currentBass = 2; // dB
        let currentVolume = 1.4; // 140%

        function initAudioEngine() {
            if (audioCtx) return;

            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioCtxClass();

            // Subsonic Filter (Highpass 38 Hz): Removes invisible sub-bass energy that over-excursions tiny speakers & causes DAC scratches
            subsonicFilter = audioCtx.createBiquadFilter();
            subsonicFilter.type = 'highpass';
            subsonicFilter.frequency.setValueAtTime(38, audioCtx.currentTime);

            // Native Master Chain
            lowpassFilter = audioCtx.createBiquadFilter();
            lowpassFilter.type = 'lowpass';
            lowpassFilter.frequency.setValueAtTime(currentWarmth, audioCtx.currentTime);

            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.setValueAtTime(100, audioCtx.currentTime);
            bassFilter.gain.setValueAtTime(currentBass, audioCtx.currentTime);

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);

            // Precision dynamic limiter prevents digital/analog clipping at high volume
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-1.5, audioCtx.currentTime);
            compressor.knee.setValueAtTime(6, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.1, audioCtx.currentTime);

            // Real-time FFT Analyser for Visualizer Sync
            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 64;
            analyserNode.smoothingTimeConstant = 0.8;
            audioDataArray = new Uint8Array(analyserNode.frequencyBinCount);

            subsonicFilter.connect(lowpassFilter);
            lowpassFilter.connect(bassFilter);
            bassFilter.connect(masterGain);
            masterGain.connect(compressor);
            compressor.connect(analyserNode);
            analyserNode.connect(audioCtx.destination);

            setupMediaSession();
        }

        function getBrownNoiseBuffer() {
            if (brownNoiseBuffer) return brownNoiseBuffer;
            
            const sampleRate = audioCtx.sampleRate;
            const duration = 45; // 45 seconds continuous stereo Brownian noise
            const bufferSize = sampleRate * duration;
            brownNoiseBuffer = audioCtx.createBuffer(2, bufferSize, sampleRate);

            const crossfadeDuration = 3; // 3 second equal-power crossfade at boundary
            const fadeSamples = Math.floor(sampleRate * crossfadeDuration);

            for (let channel = 0; channel < 2; channel++) {
                const data = brownNoiseBuffer.getChannelData(channel);
                let lastOut = 0;
                let maxPeak = 0;

                // Step 1: True Brownian random walk integration (1/f^2 spectral density)
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    lastOut = (lastOut + (0.02 * white)) / 1.02;
                    data[i] = lastOut;
                    if (Math.abs(lastOut) > maxPeak) maxPeak = Math.abs(lastOut);
                }

                // Clean peak normalization to 0.45 guarantees un-saturated headroom
                const targetPeak = 0.45;
                const normFactor = maxPeak > 0 ? (targetPeak / maxPeak) : 1;
                for (let i = 0; i < bufferSize; i++) {
                    data[i] *= normFactor;
                }

                // Step 2: Seamless crossfade at loop boundary to eliminate periodic clicks
                for (let i = 0; i < fadeSamples; i++) {
                    const progress = i / fadeSamples;
                    const fadeOut = Math.cos(progress * Math.PI * 0.5);
                    const fadeIn = Math.sin(progress * Math.PI * 0.5);

                    const endIdx = bufferSize - fadeSamples + i;
                    data[endIdx] = (data[endIdx] * fadeOut) + (data[i] * fadeIn);
                }
            }
            return brownNoiseBuffer;
        }

        function stopAudioNodes() {
            if (noiseSource) {
                try { noiseSource.stop(); noiseSource.disconnect(); } catch(e){}
                noiseSource = null;
            }
            if (lfoNode) {
                try { lfoNode.stop(); lfoNode.disconnect(); } catch(e){}
                lfoNode = null;
            }
            if (lfoGainNode) {
                try { lfoGainNode.disconnect(); } catch(e){}
                lfoGainNode = null;
            }
            if (presetFilter1) {
                try { presetFilter1.disconnect(); } catch(e){}
                presetFilter1 = null;
            }
            if (presetFilter2) {
                try { presetFilter2.disconnect(); } catch(e){}
                presetFilter2 = null;
            }
            if (presetModGain) {
                try { presetModGain.disconnect(); } catch(e){}
                presetModGain = null;
            }
        }

        function startAudio() {
            initAudioEngine();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            stopAudioNodes();

            // 1. Create 45-second continuous looping Brownian noise source
            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = getBrownNoiseBuffer();
            noiseSource.loop = true;

            // 2. Cascade biquad filters for presets
            presetFilter1 = audioCtx.createBiquadFilter();
            presetFilter2 = audioCtx.createBiquadFilter();
            presetModGain = audioCtx.createGain();

            if (currentPreset === 'super_deep') {
                presetFilter1.type = 'lowpass';
                presetFilter1.frequency.setValueAtTime(140, audioCtx.currentTime);
                presetFilter2.type = 'lowpass';
                presetFilter2.frequency.setValueAtTime(280, audioCtx.currentTime);
                presetModGain.gain.setValueAtTime(1.15, audioCtx.currentTime);

                noiseSource.connect(presetFilter1);
                presetFilter1.connect(presetFilter2);
                presetFilter2.connect(presetModGain);
            } 
            else if (currentPreset === 'womb') {
                presetFilter1.type = 'lowpass';
                presetFilter1.frequency.setValueAtTime(110, audioCtx.currentTime);
                presetFilter2.type = 'lowpass';
                presetFilter2.frequency.setValueAtTime(220, audioCtx.currentTime);
                presetModGain.gain.setValueAtTime(1.15, audioCtx.currentTime);

                // Heartbeat pulse LFO (~68 BPM = 1.13 Hz) strictly for Womb Pulse
                lfoNode = audioCtx.createOscillator();
                lfoNode.type = 'sine';
                lfoNode.frequency.setValueAtTime(68 / 60, audioCtx.currentTime);

                lfoGainNode = audioCtx.createGain();
                lfoGainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

                lfoNode.connect(lfoGainNode);
                lfoGainNode.connect(presetModGain.gain);
                lfoNode.start();

                noiseSource.connect(presetFilter1);
                presetFilter1.connect(presetFilter2);
                presetFilter2.connect(presetModGain);
            } 
            else if (currentPreset === 'velvet') {
                presetFilter1.type = 'lowpass';
                presetFilter1.frequency.setValueAtTime(220, audioCtx.currentTime);
                presetFilter2.type = 'lowpass';
                presetFilter2.frequency.setValueAtTime(450, audioCtx.currentTime);
                presetModGain.gain.setValueAtTime(1.1, audioCtx.currentTime);

                noiseSource.connect(presetFilter1);
                presetFilter1.connect(presetFilter2);
                presetFilter2.connect(presetModGain);
            } 
            else if (currentPreset === 'rain') {
                presetFilter1.type = 'lowpass';
                presetFilter1.frequency.setValueAtTime(380, audioCtx.currentTime);
                presetFilter2.type = 'highpass';
                presetFilter2.frequency.setValueAtTime(60, audioCtx.currentTime);
                presetModGain.gain.setValueAtTime(1.05, audioCtx.currentTime);

                noiseSource.connect(presetFilter1);
                presetFilter1.connect(presetFilter2);
                presetFilter2.connect(presetModGain);
            } 
            else if (currentPreset === 'cosmic') {
                presetFilter1.type = 'lowpass';
                presetFilter1.frequency.setValueAtTime(90, audioCtx.currentTime);
                presetFilter2.type = 'lowpass';
                presetFilter2.frequency.setValueAtTime(180, audioCtx.currentTime);
                presetModGain.gain.setValueAtTime(1.15, audioCtx.currentTime);

                // Ocean wave swell LFO (0.04 Hz)
                lfoNode = audioCtx.createOscillator();
                lfoNode.type = 'sine';
                lfoNode.frequency.setValueAtTime(0.04, audioCtx.currentTime);

                lfoGainNode = audioCtx.createGain();
                lfoGainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);

                lfoNode.connect(lfoGainNode);
                lfoGainNode.connect(presetModGain.gain);
                lfoNode.start();

                noiseSource.connect(presetFilter1);
                presetFilter1.connect(presetFilter2);
                presetFilter2.connect(presetModGain);
            }

            // Connect preset into master filter chain via subsonic protection filter
            presetModGain.connect(subsonicFilter);

            noiseSource.start(0);
            isPlaying = true;

            playKeepAliveAudio();
            updateUIState();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'playing';
            }
        }

        function stopAudio() {
            stopAudioNodes();
            isPlaying = false;
            updateUIState();

            pauseKeepAliveAudio();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'paused';
            }
        }

        function togglePlay() {
            if (isPlaying) {
                stopAudio();
            } else {
                startAudio();
            }
        }

        function playKeepAliveAudio() {
            const keepAliveEl = document.getElementById('background-audio-keepalive');
            if (keepAliveEl) {
                // Base64 silent WAV audio track to keep audio thread alive on lock screen
                keepAliveEl.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
                keepAliveEl.play().catch(() => {});
            }
        }

        function pauseKeepAliveAudio() {
            const keepAliveEl = document.getElementById('background-audio-keepalive');
            if (keepAliveEl) {
                keepAliveEl.pause();
            }
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Super Deep Brown Noise',
                    artist: 'Baby Soother',
                    album: 'Continuous Soothing Sound'
                });

                navigator.mediaSession.setActionHandler('play', () => startAudio());
                navigator.mediaSession.setActionHandler('pause', () => stopAudio());
                navigator.mediaSession.setActionHandler('stop', () => stopAudio());
            }
        }

        function updateUIState() {
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const playBtnLabel = document.getElementById('play-btn-label');
            const statusText = document.getElementById('status-text');
            const ripple = document.getElementById('play-ripple');

            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                playBtnLabel.textContent = 'Pause';
                statusText.textContent = 'Playing • Pure Soothing Noise';
                ripple.classList.remove('opacity-0');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                playBtnLabel.textContent = 'Play';
                statusText.textContent = 'Ready • Tap anywhere to start';
                ripple.classList.add('opacity-0');
            }
        }

        function setSleepTimer(minutes) {
            timerMinutes = minutes;
            if (timerInterval) clearInterval(timerInterval);

            const displayContainer = document.getElementById('timer-display');
            const countdownEl = document.getElementById('timer-countdown');

            // Update button active state
            document.querySelectorAll('.timer-btn').forEach(btn => {
                if (btn.dataset.timer === String(minutes)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (minutes === 'off') {
                displayContainer.classList.add('hidden');
                return;
            }

            displayContainer.classList.remove('hidden');
            timerEndTime = Date.now() + (parseInt(minutes) * 60 * 1000);

            function updateTimer() {
                const remainingSecs = Math.max(0, Math.floor((timerEndTime - Date.now()) / 1000));
                
                if (remainingSecs <= 0) {
                    clearInterval(timerInterval);
                    stopAudio();
                    setSleepTimer('off');
                    return;
                }

                const hrs = Math.floor(remainingSecs / 3600);
                const mins = Math.floor((remainingSecs % 3600) / 60);
                const secs = remainingSecs % 60;

                if (hrs > 0) {
                    countdownEl.textContent = `${hrs}h ${mins}m`;
                } else {
                    countdownEl.textContent = `${mins}m ${secs}s`;
                }
            }

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        let scene, camera, renderer;
        // Visual theme objects for 1:1 preset mapping
        let superDeepParticles, superDeepPositions, superDeepBaseGrid; // Golden Particle Wave (Screenshot Inspired)
        let wombSphereMesh, wombOriginalPositions; // Womb Pulsing Orb
        let velvetWavesMesh, velvetWavesGeometry; // Velvet Waves Horizon
        let rainGroup, rippleRings = [], rainDropsMesh; // Rain Ripples & Drops
        let cosmicGroup, cosmicCoreMesh, cosmicDustMesh; // Enriched Cosmic Nebula

        // Smoothed audio reactive parameters
        let smoothedBass = 0;
        let smoothedEnergy = 0;

        function initThreeVisualizer() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 4.2);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            container.appendChild(renderer.domElement);

            // 1. Theme: Super Deep - Golden Particle Wave Landscape (Inspired by screenshot)
            const gridCols = 80;
            const gridRows = 50;
            const particleCount = gridCols * gridRows;
            const waveGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            superDeepBaseGrid = new Float32Array(particleCount * 3);

            let pIdx = 0;
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const x = (c / (gridCols - 1) - 0.5) * 8;
                    const z = (r / (gridRows - 1) - 0.5) * 5 - 0.5;
                    const y = -0.6;

                    positions[pIdx * 3] = x;
                    positions[pIdx * 3 + 1] = y;
                    positions[pIdx * 3 + 2] = z;

                    superDeepBaseGrid[pIdx * 3] = x;
                    superDeepBaseGrid[pIdx * 3 + 1] = y;
                    superDeepBaseGrid[pIdx * 3 + 2] = z;
                    pIdx++;
                }
            }
            waveGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            superDeepPositions = waveGeo.attributes.position;

            const particleMat = new THREE.PointsMaterial({
                size: 0.045,
                color: 0xf59e0b,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending
            });
            superDeepParticles = new THREE.Points(waveGeo, particleMat);
            scene.add(superDeepParticles);

            // 2. Theme: Womb Pulse - Golden / Crimson Pulsing Core
            const wombGeo = new THREE.IcosahedronGeometry(1.3, 4);
            wombOriginalPositions = wombGeo.attributes.position.clone();
            const wombMat = new THREE.MeshBasicMaterial({
                color: 0xf59e0b,
                wireframe: true,
                transparent: true,
                opacity: 0.35
            });
            wombSphereMesh = new THREE.Mesh(wombGeo, wombMat);
            scene.add(wombSphereMesh);

            // 3. Theme: Velvet Waves Horizon
            velvetWavesGeometry = new THREE.PlaneGeometry(10, 6, 32, 20);
            const velvetMat = new THREE.MeshBasicMaterial({
                color: 0x818cf8,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            velvetWavesMesh = new THREE.Mesh(velvetWavesGeometry, velvetMat);
            velvetWavesMesh.rotation.x = -Math.PI / 3;
            velvetWavesMesh.position.y = -0.8;
            scene.add(velvetWavesMesh);

            // 4. Theme: Rain Ripples & Drops
            rainGroup = new THREE.Group();
            for (let i = 0; i < 5; i++) {
                const ringGeo = new THREE.RingGeometry(0.3 * (i + 1), 0.32 * (i + 1), 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.25
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                rainGroup.add(ring);
                rippleRings.push(ring);
            }
            // Falling rain particles
            const rainDropCount = 100;
            const rainPos = new Float32Array(rainDropCount * 3);
            for (let i = 0; i < rainDropCount; i++) {
                rainPos[i * 3] = (Math.random() - 0.5) * 6;
                rainPos[i * 3 + 1] = Math.random() * 4 - 2;
                rainPos[i * 3 + 2] = (Math.random() - 0.5) * 4;
            }
            const rainDropGeo = new THREE.BufferGeometry();
            rainDropGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
            rainDropsMesh = new THREE.Points(rainDropGeo, new THREE.PointsMaterial({
                size: 0.03,
                color: 0x7dd3fc,
                transparent: true,
                opacity: 0.5
            }));
            rainGroup.add(rainDropsMesh);
            scene.add(rainGroup);

            // 5. Theme: Enriched Cosmic Nebula (Celestial Core + Orbital Dust Rings + Star Field)
            cosmicGroup = new THREE.Group();
            
            // Central Glowing Sphere / Core
            const coreGeo = new THREE.IcosahedronGeometry(0.8, 3);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0xfbbf24,
                wireframe: true,
                transparent: true,
                opacity: 0.45
            });
            cosmicCoreMesh = new THREE.Mesh(coreGeo, coreMat);
            cosmicGroup.add(cosmicCoreMesh);

            // Orbiting Swirling Galaxy Dust Rings
            const dustCount = 450;
            const dustPos = new Float32Array(dustCount * 3);
            for (let i = 0; i < dustCount; i++) {
                const radius = 1.2 + Math.random() * 2.5;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * 0.8;

                dustPos[i * 3] = radius * Math.cos(theta);
                dustPos[i * 3 + 1] = radius * Math.sin(phi);
                dustPos[i * 3 + 2] = radius * Math.sin(theta);
            }
            const dustGeo = new THREE.BufferGeometry();
            dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
            cosmicDustMesh = new THREE.Points(dustGeo, new THREE.PointsMaterial({
                size: 0.04,
                color: 0xf59e0b,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            }));
            cosmicGroup.add(cosmicDustMesh);
            scene.add(cosmicGroup);

            updateVisualThemeVisibility();
            animateVisualizer();
        }

        function updateVisualThemeVisibility() {
            if (!superDeepParticles) return;

            // 1:1 Automatic Binding to Active Sound Preset
            superDeepParticles.visible = (currentPreset === 'super_deep');
            wombSphereMesh.visible = (currentPreset === 'womb');
            velvetWavesMesh.visible = (currentPreset === 'velvet');
            rainGroup.visible = (currentPreset === 'rain');
            cosmicGroup.visible = (currentPreset === 'cosmic');

            // Adjust camera position per preset for optimal view
            if (currentPreset === 'super_deep') {
                camera.position.set(0, 0.8, 3.8);
            } else if (currentPreset === 'velvet') {
                camera.position.set(0, 0.5, 4.0);
            } else {
                camera.position.set(0, 0, 4.2);
            }
            camera.lookAt(0, 0, 0);
        }

        function animateVisualizer() {
            animationFrameId = requestAnimationFrame(animateVisualizer);

            if (document.hidden) return;

            // Sample live FFT audio energy if playing
            let rawBass = 0;
            let rawEnergy = 0;

            if (analyserNode && isPlaying && audioDataArray) {
                analyserNode.getByteFrequencyData(audioDataArray);
                let sumLow = 0;
                let sumTotal = 0;
                const len = audioDataArray.length;

                for (let i = 0; i < len; i++) {
                    const val = audioDataArray[i];
                    sumTotal += val;
                    if (i < len / 4) sumLow += val; // Sub/Low bins
                }

                rawBass = (sumLow / (len / 4)) / 255;
                rawEnergy = (sumTotal / len) / 255;
            }

            // Smooth interpolation (lerp) for gentle nursery aesthetic
            smoothedBass += (rawBass - smoothedBass) * 0.1;
            smoothedEnergy += (rawEnergy - smoothedEnergy) * 0.1;

            const time = performance.now() * 0.001;

            // 1. Theme: Super Deep - Golden Particle Wave (Inspired by screenshot)
            if (superDeepParticles && superDeepParticles.visible) {
                const count = superDeepPositions.count;
                for (let i = 0; i < count; i++) {
                    const bx = superDeepBaseGrid[i * 3];
                    const by = superDeepBaseGrid[i * 3 + 1];
                    const bz = superDeepBaseGrid[i * 3 + 2];

                    const waveZ = Math.sin(bx * 1.8 + time * 1.5) * Math.cos(bz * 1.8 + time * 1.2) * (0.35 + smoothedBass * 1.2);
                    const waveY = by + Math.sin(bx * 2.5 + time * 2.0) * 0.12 * (1 + smoothedBass * 1.5);

                    superDeepPositions.setXYZ(i, bx, waveY, bz + waveZ);
                }
                superDeepPositions.needsUpdate = true;
                superDeepParticles.rotation.y = Math.sin(time * 0.1) * 0.1;
            }

            // 2. Theme: Womb Pulsing Core
            if (wombSphereMesh && wombSphereMesh.visible) {
                wombSphereMesh.rotation.y += 0.003 + (smoothedBass * 0.005);
                const posAttr = wombSphereMesh.geometry.attributes.position;
                const count = posAttr.count;
                const targetScale = 1 + (smoothedBass * 0.45);
                wombSphereMesh.scale.set(targetScale, targetScale, targetScale);

                for (let i = 0; i < count; i++) {
                    const u = wombOriginalPositions.getX(i);
                    const v = wombOriginalPositions.getY(i);
                    const w = wombOriginalPositions.getZ(i);

                    const noise = Math.sin(u * 2 + time * 2) * Math.cos(v * 2 + time * 2) * 0.08 * (1 + smoothedBass * 2);
                    posAttr.setXYZ(i, u + u * noise, v + v * noise, w + w * noise);
                }
                posAttr.needsUpdate = true;
            }

            // 3. Theme: Velvet Waves Horizon
            if (velvetWavesMesh && velvetWavesMesh.visible) {
                const wPos = velvetWavesGeometry.attributes.position;
                for (let i = 0; i < wPos.count; i++) {
                    const x = wPos.getX(i);
                    const y = wPos.getY(i);
                    const z = Math.sin(x * 1.5 + time * 1.5) * Math.cos(y * 1.5 + time * 1.5) * (0.2 + smoothedBass * 0.8);
                    wPos.setZ(i, z);
                }
                wPos.needsUpdate = true;
            }

            // 4. Theme: Rain Ripples & Drops
            if (rainGroup && rainGroup.visible) {
                rippleRings.forEach((ring, idx) => {
                    const ringScale = 1 + ((time * 0.8 + idx * 0.4) % 1.5) + (smoothedBass * 0.5);
                    ring.scale.set(ringScale, ringScale, 1);
                    ring.material.opacity = Math.max(0, 0.45 - (ringScale - 1) * 0.3);
                });
                
                // Animate falling rain particles
                if (rainDropsMesh) {
                    const rPos = rainDropsMesh.geometry.attributes.position;
                    for (let i = 0; i < rPos.count; i++) {
                        let y = rPos.getY(i) - 0.02 - (smoothedEnergy * 0.03);
                        if (y < -2) y = 2;
                        rPos.setY(i, y);
                    }
                    rPos.needsUpdate = true;
                }
            }

            // 5. Theme: Enriched Cosmic Nebula
            if (cosmicGroup && cosmicGroup.visible) {
                cosmicCoreMesh.rotation.y += 0.005;
                cosmicCoreMesh.rotation.x += 0.003;
                const cScale = 1 + (smoothedBass * 0.35);
                cosmicCoreMesh.scale.set(cScale, cScale, cScale);

                cosmicDustMesh.rotation.y -= 0.002 + (smoothedEnergy * 0.004);
                cosmicDustMesh.rotation.z += 0.001;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initThreeVisualizer();

            // Big Play Button & Screen Tap
            document.getElementById('big-play-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay();
            });

            document.getElementById('main-touch-zone').addEventListener('click', () => {
                togglePlay();
            });

            // Preset Selection Buttons (Auto-syncs audio preset & matching visualizer)
            document.querySelectorAll('.preset-card').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.preset-card').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPreset = btn.dataset.preset;

                    updateVisualThemeVisibility();

                    if (isPlaying) {
                        startAudio(); // Smoothly switch preset live
                    }
                });
            });

            // Sleep Timer Buttons
            document.querySelectorAll('.timer-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setSleepTimer(btn.dataset.timer);
                });
            });

            // Night Mode Screen Dimmer Toggle
            document.getElementById('dimmer-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                isDimmed = !isDimmed;
                const overlay = document.getElementById('night-overlay');
                if (isDimmed) {
                    overlay.style.opacity = '0.85';
                } else {
                    overlay.style.opacity = '0';
                }
            });

            // Acoustic Config Modal Controls
            const modal = document.getElementById('config-modal');
            
            document.getElementById('config-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                modal.classList.remove('hidden');
            });

            document.getElementById('close-config-btn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            document.getElementById('apply-config-btn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            // Reset Acoustic Settings to Default
            document.getElementById('reset-config-btn').addEventListener('click', () => {
                currentWarmth = 280;
                currentBass = 2;
                currentVolume = 1.4;

                warmthSlider.value = 280;
                bassSlider.value = 2;
                volumeSlider.value = 140;

                document.getElementById('warmth-val').textContent = '280 Hz';
                document.getElementById('bass-val').textContent = '+2 dB';
                document.getElementById('volume-val').textContent = '140%';

                if (lowpassFilter && audioCtx) {
                    lowpassFilter.frequency.setValueAtTime(280, audioCtx.currentTime);
                }
                if (bassFilter && audioCtx) {
                    bassFilter.gain.setValueAtTime(2, audioCtx.currentTime);
                }
                if (masterGain && audioCtx) {
                    masterGain.gain.setValueAtTime(1.4, audioCtx.currentTime);
                }
            });

            // Sliders
            const warmthSlider = document.getElementById('warmth-slider');
            const bassSlider = document.getElementById('bass-slider');
            const volumeSlider = document.getElementById('volume-slider');

            warmthSlider.addEventListener('input', (e) => {
                currentWarmth = parseFloat(e.target.value);
                document.getElementById('warmth-val').textContent = `${currentWarmth} Hz`;
                if (lowpassFilter && audioCtx) {
                    lowpassFilter.frequency.setValueAtTime(currentWarmth, audioCtx.currentTime);
                }
            });

            bassSlider.addEventListener('input', (e) => {
                currentBass = parseFloat(e.target.value);
                document.getElementById('bass-val').textContent = `+${currentBass} dB`;
                if (bassFilter && audioCtx) {
                    bassFilter.gain.setValueAtTime(currentBass, audioCtx.currentTime);
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                currentVolume = val / 100;
                document.getElementById('volume-val').textContent = `${val}%`;
                if (masterGain && audioCtx) {
                    masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
                }
            });

            // Window Resize handling
            window.addEventListener('resize', () => {
                if (camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            // Auto-hide UI after 5 seconds of inactivity
            let idleTimer = null;
            let isUiHidden = false;

            function showUI() {
                const header = document.querySelector('header');
                const main = document.getElementById('main-touch-zone');
                const footer = document.querySelector('footer');
                
                [header, main, footer].forEach(el => {
                    if (el) el.classList.remove('opacity-0', 'pointer-events-none');
                });
                isUiHidden = false;
                resetIdleTimer();
            }

            function hideUI() {
                const modal = document.getElementById('config-modal');
                if (modal && !modal.classList.contains('hidden')) return;

                const header = document.querySelector('header');
                const main = document.getElementById('main-touch-zone');
                const footer = document.querySelector('footer');
                
                [header, main, footer].forEach(el => {
                    if (el) el.classList.add('opacity-0', 'pointer-events-none');
                });
                isUiHidden = true;
            }

            function resetIdleTimer() {
                if (idleTimer) clearTimeout(idleTimer);
                idleTimer = setTimeout(hideUI, 5000);
            }

            ['pointerdown', 'mousemove', 'keydown', 'touchstart'].forEach(eventType => {
                window.addEventListener(eventType, () => {
                    if (isUiHidden) {
                        showUI();
                    } else {
                        resetIdleTimer();
                    }
                }, { passive: true });
            });

            resetIdleTimer();
        });
    </script>
</body>
</html>
