<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Brown Noise - Continuous Soother</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for Soothing Ambient Visualizer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090a10;
            color: #e2e8f0;
        }

        /* Custom Scrollbar for preset selection */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Glassmorphism elements */
        .glass-panel {
            background: rgba(18, 20, 32, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .glass-button:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }

        .preset-card.active {
            background: rgba(245, 158, 11, 0.18);
            border-color: rgba(245, 158, 11, 0.5);
            color: #fbbf24;
        }

        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            height: 8px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
        }

        /* Ambient Glow Pulse */
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        .pulse-glow {
            animation: gentlePulse 6s infinite ease-in-out;
        }

        /* Night Mode Dimmer Overlay */
        #night-overlay {
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between h-full w-full select-none">

    <!-- Canvas for 3D Three.js Ambient Visualizer -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- Screen Dimmer Overlay for Dark Nursery -->
    <div id="night-overlay" class="absolute inset-0 z-10 bg-black opacity-0 pointer-events-none"></div>

    <!-- Main Interactive Header -->
    <header class="relative z-20 p-5 flex items-center justify-between glass-panel border-b-0 rounded-b-2xl mx-3 mt-3">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-100 tracking-wide leading-tight">Brown Noise</h1>
                <p class="text-xs text-slate-400 font-medium" id="status-text">Ready • Tap anywhere to start</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Screen Dimmer Toggle -->
            <button id="dimmer-btn" class="glass-button p-2.5 rounded-xl text-slate-300 hover:text-white" title="Dim Screen">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
            <!-- Controls / Settings Button -->
            <button id="config-btn" class="glass-button p-2.5 rounded-xl text-slate-300 hover:text-white" title="Sound Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Large Interactive Center Play Zone -->
    <main id="main-touch-zone" class="relative z-20 flex-1 flex flex-col items-center justify-center cursor-pointer p-4 text-center">
        <div class="relative flex items-center justify-center">
            <!-- Outer Ripple Effect Ring -->
            <div id="play-ripple" class="absolute w-56 h-56 rounded-full border border-amber-500/20 pulse-glow"></div>
            
            <!-- Central Huge Play/Pause Circle Button -->
            <button id="big-play-btn" class="w-40 h-40 rounded-full glass-panel border-2 border-amber-500/40 flex flex-col items-center justify-center gap-2 shadow-2xl transition-all duration-300 hover:scale-105 active:scale-95 bg-gradient-to-b from-amber-500/10 to-transparent">
                <svg id="play-icon" class="w-14 h-14 text-amber-400 translate-x-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pause-icon" class="w-14 h-14 text-amber-400 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span id="play-btn-label" class="text-xs font-semibold uppercase tracking-wider text-amber-300/80">Play Noise</span>
            </button>
        </div>

        <!-- Timer Countdown Display -->
        <div id="timer-display" class="mt-8 px-4 py-1.5 rounded-full glass-button text-xs text-amber-300/90 font-medium tracking-wide hidden">
            Timer: <span id="timer-countdown">Infinite</span>
        </div>
    </main>

    <!-- Bottom Controls & Sound Selector -->
    <footer class="relative z-20 p-5 glass-panel rounded-t-3xl border-t-0 mx-2 mb-2 flex flex-col gap-4">
        
        <!-- Preset Track Selection (Large Touch Pills) -->
        <div class="flex flex-col gap-2">
            <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase px-1">Sound Texture</span>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button data-preset="super_deep" class="preset-card active glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-sm font-medium">
                    <span>🌙</span> Super Deep
                </button>
                <button data-preset="womb" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-sm font-medium">
                    <span>❤️</span> Womb Pulse
                </button>
                <button data-preset="velvet" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-sm font-medium">
                    <span>☁️</span> Velvet Soft
                </button>
                <button data-preset="rain" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-sm font-medium">
                    <span>🌧️</span> Soft Rain Brown
                </button>
                <button data-preset="cosmic" class="preset-card glass-button px-4 py-3 rounded-2xl flex-shrink-0 flex items-center gap-2 text-sm font-medium">
                    <span>🌌</span> Cosmic Rumble
                </button>
            </div>
        </div>

        <!-- Sleep Timer Buttons -->
        <div class="flex flex-col gap-2">
            <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase px-1">Sleep Timer</span>
            <div class="grid grid-cols-5 gap-2">
                <button data-timer="off" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-amber-400 border-amber-500/40">∞</button>
                <button data-timer="15" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">15m</button>
                <button data-timer="30" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">30m</button>
                <button data-timer="60" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">1h</button>
                <button data-timer="480" class="timer-btn glass-button py-2.5 rounded-xl text-xs font-semibold text-slate-300">8h</button>
            </div>
        </div>
    </footer>

    <!-- Config Modal -->
    <div id="config-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 flex flex-col gap-6 border border-white/10">
            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <h3 class="text-lg font-bold text-slate-100">Acoustic Settings</h3>
                <button id="close-config-btn" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Tone / Warmth Slider -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between text-sm font-medium">
                    <span class="text-slate-300">Warmth (Filter Cutoff)</span>
                    <span id="warmth-val" class="text-amber-400">180 Hz</span>
                </div>
                <input id="warmth-slider" type="range" min="80" max="400" value="180" class="w-full">
            </div>

            <!-- Pitch / Texture Softness -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between text-sm font-medium">
                    <span class="text-slate-300">Sub-Bass Boost</span>
                    <span id="bass-val" class="text-amber-400">+4 dB</span>
                </div>
                <input id="bass-slider" type="range" min="0" max="10" value="4" class="w-full">
            </div>

            <!-- Master Volume -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between text-sm font-medium">
                    <span class="text-slate-300">Volume</span>
                    <span id="volume-val" class="text-amber-400">80%</span>
                </div>
                <input id="volume-slider" type="range" min="0" max="100" value="80" class="w-full">
            </div>

            <button id="apply-config-btn" class="mt-2 w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-2xl transition-all">
                Done
            </button>
        </div>
    </div>

    <!-- Hidden HTML5 Audio Element to ensure lock screen media session persistence on mobile devices -->
    <audio id="background-audio-keepalive" loop class="hidden"></audio>

    <script>
        // Audio Session Setup for iPad/iOS Safari background playback
        if ('audioSession' in navigator) {
            try {
                navigator.audioSession.type = "playback";
            } catch (e) {
                console.log("AudioSession type setup error:", e);
            }
        }

        // Web Audio Context & State
        let audioCtx = null;
        let noiseSource = null;
        let lowpassFilter = null;
        let bassFilter = null;
        let masterGain = null;
        let isPlaying = false;
        let currentPreset = 'super_deep';
        let timerTimeout = null;
        let timerInterval = null;
        let timerEndTime = null;

        // Audio Settings Values
        let currentWarmth = 180; // Hz
        let currentBass = 4; // dB
        let currentVolume = 0.8;

        // Initialize Web Audio Engine
        function initAudioEngine() {
            if (audioCtx) return;

            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioCtxClass();

            // Create Audio Nodes Pipeline
            // Source (AudioBuffer) -> Lowpass Filter -> LowShelf Bass Boost -> Master Gain -> Destination
            lowpassFilter = audioCtx.createBiquadFilter();
            lowpassFilter.type = 'lowpass';
            lowpassFilter.frequency.setValueAtTime(currentWarmth, audioCtx.currentTime);

            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.setValueAtTime(100, audioCtx.currentTime);
            bassFilter.gain.setValueAtTime(currentBass, audioCtx.currentTime);

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);

            lowpassFilter.connect(bassFilter);
            bassFilter.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            // Register Web Media Session API for lockscreen playback controls
            setupMediaSession();
        }

        // Generate high-precision procedural audio buffers (10 seconds seamless loop)
        function generateNoiseBuffer(preset) {
            if (!audioCtx) return null;

            const duration = 10; // 10s seamlessly looped buffer
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = sampleRate * duration;
            const buffer = audioCtx.createBuffer(2, bufferSize, sampleRate);

            for (let channel = 0; channel < 2; channel++) {
                const data = buffer.getChannelData(channel);
                let lastOut = 0.0;

                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;

                    if (preset === 'super_deep') {
                        // True Brownian integrated noise
                        lastOut = (lastOut + (0.02 * white)) / 1.02;
                        data[i] = lastOut * 3.5;
                    } 
                    else if (preset === 'womb') {
                        // Brown noise + rhythmic maternal pulse LFO (~50 BPM)
                        lastOut = (lastOut + (0.018 * white)) / 1.018;
                        const t = i / sampleRate;
                        const pulse = 1 + 0.18 * Math.sin(2 * Math.PI * t * (50 / 60)) + 0.1 * Math.sin(4 * Math.PI * t * (50 / 60));
                        data[i] = lastOut * 3.2 * pulse;
                    } 
                    else if (preset === 'velvet') {
                        // Smoother velvet brown noise with softer roll-off
                        lastOut = (lastOut + (0.025 * white)) / 1.025;
                        data[i] = lastOut * 2.8;
                    } 
                    else if (preset === 'rain') {
                        // Brown noise base + gentle lowpass filtered rain droplets
                        lastOut = (lastOut + (0.02 * white)) / 1.02;
                        const rainDrop = Math.random() > 0.9985 ? (Math.random() * 0.12) : 0;
                        data[i] = (lastOut * 2.9) + rainDrop;
                    } 
                    else if (preset === 'cosmic') {
                        // Extra ultra-low frequency rumble
                        lastOut = (lastOut + (0.012 * white)) / 1.012;
                        data[i] = lastOut * 4.2;
                    }
                }
            }
            return buffer;
        }

        function startAudio() {
            initAudioEngine();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (noiseSource) {
                try { noiseSource.stop(); } catch(e){}
            }

            const buffer = generateNoiseBuffer(currentPreset);
            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;
            noiseSource.connect(lowpassFilter);

            noiseSource.start(0);
            isPlaying = true;

            // Trigger silent HTML5 Audio keepalive for mobile lockscreen background play
            playKeepAliveAudio();

            updateUIState();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'playing';
            }
        }

        function pauseAudio() {
            if (noiseSource) {
                try { noiseSource.stop(); } catch(e){}
                noiseSource = null;
            }
            isPlaying = false;
            updateUIState();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'paused';
            }
        }

        function toggleAudio() {
            if (isPlaying) {
                pauseAudio();
            } else {
                startAudio();
            }
        }

        // Silent keepalive audio loop generation to prevent mobile browsers from suspending Web Audio in background
        function playKeepAliveAudio() {
            const keepAliveEl = document.getElementById('background-audio-keepalive');
            if (!keepAliveEl.src) {
                // Short silent WAV data URI
                keepAliveEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
            }
            keepAliveEl.play().catch(() => {});
        }

        // Setup Media Session API
        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: getPresetName(currentPreset),
                    artist: 'Baby Sleep Companion',
                    album: 'Continuous Brown Noise',
                    artwork: [
                        { src: 'https://placehold.co/512x512/090a10/f59e0b?text=Brown+Noise', sizes: '512x512', type: 'image/png' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', startAudio);
                navigator.mediaSession.setActionHandler('pause', pauseAudio);
            }
        }

        function getPresetName(preset) {
            switch(preset) {
                case 'super_deep': return 'Super Deep Brown Noise';
                case 'womb': return 'Womb Pulse Noise';
                case 'velvet': return 'Velvet Soft Noise';
                case 'rain': return 'Soft Rain Brown Noise';
                case 'cosmic': return 'Cosmic Deep Rumble';
                default: return 'Brown Noise';
            }
        }

        let scene, camera, renderer, ambientSphere, particles;

        function initVisualizer() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x090a10, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Create Inner Ambient Glowing Mesh
            const sphereGeo = new THREE.IcosahedronGeometry(6, 4);
            const sphereMat = new THREE.MeshBasicMaterial({
                color: 0xf59e0b,
                wireframe: true,
                transparent: true,
                opacity: 0.25
            });
            ambientSphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(ambientSphere);

            // Create Floating Organic Dust Particles
            const particlesGeo = new THREE.BufferGeometry();
            const particleCount = 200;
            const posArray = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 60;
            }

            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({
                size: 0.15,
                color: 0xfbbf24,
                transparent: true,
                opacity: 0.4
            });

            particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            // Animate Loop
            function animate() {
                requestAnimationFrame(animate);

                const time = Date.now() * 0.0008;

                if (ambientSphere) {
                    ambientSphere.rotation.x = time * 0.2;
                    ambientSphere.rotation.y = time * 0.3;

                    // Breathe scale based on audio state
                    const targetScale = isPlaying ? (1 + 0.08 * Math.sin(time * 2)) : 1;
                    ambientSphere.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.05);
                }

                if (particles) {
                    particles.rotation.y = time * 0.05;
                }

                renderer.render(scene, camera);
            }

            animate();

            // Window Resize Handling
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // UI Elements
        const playBtn = document.getElementById('big-play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const playBtnLabel = document.getElementById('play-btn-label');
        const statusText = document.getElementById('status-text');
        const playRipple = document.getElementById('play-ripple');
        const mainTouchZone = document.getElementById('main-touch-zone');
        const configBtn = document.getElementById('config-btn');
        const configModal = document.getElementById('config-modal');
        const closeConfigBtn = document.getElementById('close-config-btn');
        const applyConfigBtn = document.getElementById('apply-config-btn');
        const dimmerBtn = document.getElementById('dimmer-btn');
        const nightOverlay = document.getElementById('night-overlay');

        function updateUIState() {
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                playBtnLabel.textContent = "Pause Noise";
                statusText.textContent = "Playing • " + getPresetName(currentPreset);
                playRipple.classList.add('pulse-glow');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                playBtnLabel.textContent = "Play Noise";
                statusText.textContent = "Paused • Tap to play";
                playRipple.classList.remove('pulse-glow');
            }
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Giant Play target
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleAudio();
            });

            // Tap anywhere on center zone to toggle
            mainTouchZone.addEventListener('click', () => {
                toggleAudio();
            });

            // Preset Button Clicks
            document.querySelectorAll('.preset-card').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.preset-card').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPreset = btn.dataset.preset;

                    if (isPlaying) {
                        startAudio(); // Restart with new preset sound
                    }
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata.title = getPresetName(currentPreset);
                    }
                });
            });

            // Timer Button Clicks
            document.querySelectorAll('.timer-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.timer-btn').forEach(b => {
                        b.classList.remove('border-amber-500/40', 'text-amber-400');
                        b.classList.add('text-slate-300');
                    });
                    btn.classList.add('border-amber-500/40', 'text-amber-400');
                    btn.classList.remove('text-slate-300');

                    const timerVal = btn.dataset.timer;
                    setSleepTimer(timerVal);
                });
            });

            // Dimmer Toggle
            let isDimmed = false;
            dimmerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isDimmed = !isDimmed;
                nightOverlay.style.opacity = isDimmed ? '0.85' : '0';
            });

            // Tap dimmed screen to un-dim
            nightOverlay.addEventListener('click', () => {
                if (isDimmed) {
                    isDimmed = false;
                    nightOverlay.style.opacity = '0';
                }
            });

            // Config Modal
            configBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                configModal.classList.remove('hidden');
            });

            closeConfigBtn.addEventListener('click', () => configModal.classList.add('hidden'));
            applyConfigBtn.addEventListener('click', () => configModal.classList.add('hidden'));

            // Audio Sliders
            const warmthSlider = document.getElementById('warmth-slider');
            const bassSlider = document.getElementById('bass-slider');
            const volumeSlider = document.getElementById('volume-slider');

            warmthSlider.addEventListener('input', (e) => {
                currentWarmth = parseFloat(e.target.value);
                document.getElementById('warmth-val').textContent = currentWarmth + ' Hz';
                if (lowpassFilter && audioCtx) {
                    lowpassFilter.frequency.setValueAtTime(currentWarmth, audioCtx.currentTime);
                }
            });

            bassSlider.addEventListener('input', (e) => {
                currentBass = parseFloat(e.target.value);
                document.getElementById('bass-val').textContent = '+' + currentBass + ' dB';
                if (bassFilter && audioCtx) {
                    bassFilter.gain.setValueAtTime(currentBass, audioCtx.currentTime);
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                currentVolume = parseFloat(e.target.value) / 100;
                document.getElementById('volume-val').textContent = e.target.value + '%';
                if (masterGain && audioCtx) {
                    masterGain.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
                }
            });
        }

        // Sleep Timer Logic
        function setSleepTimer(minutes) {
            if (timerTimeout) clearTimeout(timerTimeout);
            if (timerInterval) clearInterval(timerInterval);

            const timerDisplay = document.getElementById('timer-display');
            const timerCountdown = document.getElementById('timer-countdown');

            if (minutes === 'off') {
                timerDisplay.classList.add('hidden');
                return;
            }

            const durationMs = parseInt(minutes, 10) * 60 * 1000;
            timerEndTime = Date.now() + durationMs;
            timerDisplay.classList.remove('hidden');

            function updateTimerUI() {
                const remainingMs = Math.max(0, timerEndTime - Date.now());
                if (remainingMs <= 0) {
                    pauseAudio();
                    timerDisplay.classList.add('hidden');
                    clearInterval(timerInterval);
                    return;
                }
                const totalSec = Math.ceil(remainingMs / 1000);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                timerCountdown.textContent = `${mins}m ${secs < 10 ? '0' : ''}${secs}s`;
            }

            updateTimerUI();
            timerInterval = setInterval(updateTimerUI, 1000);
        }

        // On Window Load
        window.onload = function() {
            initVisualizer();
            setupEventListeners();
        };
    </script>
</body>
</html>
