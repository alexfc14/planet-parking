<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congas - Juego de Circuitos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a12;
            color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Outfit', sans-serif;
        }

        /* Square Board Cell */
        .grid-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            transition: all 0.2s ease;
            box-sizing: border-box;
            border-radius: 0;
            overflow: visible;
        }

        /* Clean Cell Background Tints */
        .cell-R-bg { background-color: rgba(239, 68, 68, 0.06); }
        .cell-Y-bg { background-color: rgba(234, 179, 8, 0.06); }
        .cell-B-bg { background-color: rgba(59, 130, 246, 0.06); }
        .cell-G-bg { background-color: rgba(34, 197, 94, 0.06); }
        .cell-P-bg { background-color: rgba(168, 85, 247, 0.06); }

        .cell-rb-bg { background-color: rgba(239, 68, 68, 0.1); }
        .cell-yb-bg { background-color: rgba(234, 179, 8, 0.1); }
        .cell-gb-bg { background-color: rgba(34, 197, 94, 0.1); }
        .cell-pb-bg { background-color: rgba(168, 85, 247, 0.1); }

        /* Square Piece - Centered & Smaller than cell */
        .square-piece {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            width: 68%;
            height: 68%;
            border-radius: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            will-change: transform;
            backface-visibility: hidden;
        }

        .piece-Red {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: 2px solid #fca5a5;
        }

        .piece-Yellow {
            background: linear-gradient(135deg, #facc15, #eab308);
            border: 2px solid #fef08a;
        }

        .piece-Blue {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: 2px solid #bfdbfe;
        }

        .piece-Green {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: 2px solid #86efac;
        }

        .piece-Purple {
            background: linear-gradient(135deg, #a855f7, #9333ea);
            border: 2px solid #e9d5ff;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5 bg-slate-950 text-slate-100">

    <!-- Top Header Bar -->
    <header class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-3 mb-2">
        <div class="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-left">
            <div>
                <h1 class="text-3xl sm:text-4xl font-black title-font bg-clip-text text-transparent bg-gradient-to-r from-red-500 via-pink-500 to-purple-400 tracking-wide">
                    Congas
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">
                    Rota las congas de colores para devolver cada ficha a su circuito.
                </p>
            </div>

            <!-- Level Selector Tabs -->
            <div class="flex items-center gap-1.5 bg-slate-900/90 border border-slate-800 p-1 rounded-xl shadow-md">
                <button id="lvl-1-btn" onclick="switchLevel(1)" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md">
                    Nivel 1 (6x5)
                </button>
                <button id="lvl-2-btn" onclick="switchLevel(2)" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-slate-200">
                    Nivel 2 (6x6)
                </button>
            </div>
        </div>

        <div class="flex items-center gap-4 bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-2xl shadow-lg">
            <div class="text-center px-2">
                <span class="text-[10px] text-slate-400 block uppercase font-extrabold tracking-wider">MOVIMIENTOS</span>
                <span id="move-counter" class="text-lg font-black text-amber-400 title-font">0</span>
            </div>
        </div>
    </header>

    <!-- Main Content: Side Panel + Board -->
    <main class="w-full max-w-5xl my-auto flex flex-row items-center justify-center gap-4 sm:gap-7">
        
        <!-- Left Side Control Panel -->
        <div class="shrink-0 flex flex-col gap-3 justify-center items-center">
            
            <!-- Capsule Container for Loop Rotation Controls -->
            <div id="controls-capsule" class="bg-slate-900/90 border border-slate-800/80 p-3 sm:p-3.5 rounded-[2.2rem] shadow-xl flex flex-col gap-3 items-center">
                <!-- Dynamically populated by JS based on level -->
            </div>

            <!-- Utility Icon Buttons Below Capsule -->
            <div class="flex flex-col gap-2 w-full">
                <button onclick="scrambleBoardAnimated()" title="Mezclar fichas" class="w-full bg-purple-900/30 hover:bg-purple-800/40 text-purple-200 border border-purple-500/30 font-semibold py-2.5 px-3 rounded-xl active:scale-95 flex items-center justify-center transition-all text-sm">
                    <i class="fa-solid fa-shuffle text-purple-400"></i>
                </button>
                <button id="btn-undo" onclick="undoMove()" title="Deshacer último movimiento" class="w-full bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700 font-semibold py-2.5 px-3 rounded-xl active:scale-95 flex items-center justify-center transition-all text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-rotate-left text-slate-400"></i>
                </button>
            </div>

        </div>

        <!-- Right Side: Grid Board -->
        <div class="flex-1 min-w-0 max-w-[580px] flex justify-center">
            <div class="bg-slate-900/90 p-3.5 sm:p-4 rounded-[2rem] border border-slate-800 shadow-2xl relative w-full">
                
                <!-- Win Overlay -->
                <div id="win-overlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-[2rem] z-30 flex flex-col items-center justify-center p-6 text-center">
                    <i class="fa-solid fa-trophy text-6xl text-amber-400 mb-4 animate-bounce"></i>
                    <h2 class="text-3xl font-black text-white title-font mb-2">¡Completado!</h2>
                    <p class="text-xs sm:text-sm text-slate-300 max-w-xs mb-6">Todas las congas han vuelto a su circuito correspondiente.</p>
                    <button onclick="scrambleBoardAnimated()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-xl active:scale-95 transition-all text-sm">
                        Jugar de Nuevo
                    </button>
                </div>

                <!-- Grid Container -->
                <div id="board-grid" class="grid gap-0 w-full relative rounded-2xl overflow-hidden border border-slate-800/80">
                    <!-- Dynamic Grid Generated by JS -->
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-[11px] text-slate-500 text-center mt-1">
        Congas &bull; Juegos de Circuitos Continuos
    </footer>

    <!-- JavaScript Game Logic -->
    <script>
        // Track Line Colors
        const TRACK_COLORS = {
            'R': '#ef4444',
            'B': '#3b82f6',
            'Y': '#eab308',
            'G': '#22c55e',
            'P': '#a855f7'
        };

        // LEVEL DEFINITIONS
        const LEVELS = {
            1: {
                cols: 6,
                rows: 5,
                cellTypes: [
                    ['R',  'R',  'R',  'Y',  'Y',  'Y'],
                    ['R',  'B',  'rb', 'yb', 'B',  'Y'],
                    ['R',  'B',  'R',  'Y',  'B',  'Y'],
                    ['R',  'B',  'rb', 'yb', 'B',  'Y'],
                    ['R',  'R',  'R',  'Y',  'Y',  'Y']
                ],
                loops: [
                    {
                        id: 'RED',
                        color: 'R',
                        pieceColor: 'Red',
                        dir: 1, // CCW ↺
                        icon: 'fa-rotate-left',
                        title: 'Conga Roja (↺)',
                        bgBtn: 'from-red-500 to-red-600 border-red-300/40 text-white shadow-red-950/80',
                        path: [
                            [0, 0], [0, 1], [0, 2], [0, 3], [0, 4],
                            [1, 4], [2, 4],
                            [2, 3], [2, 2], [2, 1],
                            [2, 0], [1, 0]
                        ]
                    },
                    {
                        id: 'BLUE',
                        color: 'B',
                        pieceColor: 'Blue',
                        dir: 1, // CCW ↺
                        icon: 'fa-rotate-left',
                        title: 'Conga Azul (↺)',
                        bgBtn: 'from-blue-500 to-blue-600 border-blue-300/40 text-white shadow-blue-950/80',
                        path: [
                            [1, 1], [1, 2], [1, 3],
                            [2, 3], [3, 3], [4, 3],
                            [4, 2], [4, 1],
                            [3, 1], [2, 1]
                        ]
                    },
                    {
                        id: 'YELLOW',
                        color: 'Y',
                        pieceColor: 'Yellow',
                        dir: -1, // CW ↻
                        icon: 'fa-rotate-right',
                        title: 'Conga Amarilla (↻)',
                        bgBtn: 'from-amber-400 to-yellow-500 border-yellow-200/50 text-slate-950 shadow-amber-950/80',
                        path: [
                            [3, 0], [4, 0], [5, 0],
                            [5, 1], [5, 2], [5, 3], [5, 4],
                            [4, 4], [3, 4],
                            [3, 3], [3, 2], [3, 1]
                        ]
                    }
                ],
                initialPieces: function() {
                    const pieces = [];
                    // Red path
                    this.loops[0].path.forEach(([x, y], idx) => {
                        pieces.push({ x, y, piece: { id: `R${idx + 1}`, color: 'Red' } });
                    });
                    // Yellow path
                    this.loops[2].path.forEach(([x, y], idx) => {
                        pieces.push({ x, y, piece: { id: `Y${idx + 1}`, color: 'Yellow' } });
                    });
                    // Blue-only cells
                    const blueCells = [[1, 1], [1, 2], [1, 3], [4, 1], [4, 2], [4, 3]];
                    blueCells.forEach(([x, y], idx) => {
                        pieces.push({ x, y, piece: { id: `B${idx + 1}`, color: 'Blue' } });
                    });
                    return pieces;
                }
            },
            2: {
                cols: 6,
                rows: 6,
                cellTypes: [
                    ['R',  'R',  'R',  'Y',  'Y',  'Y'],
                    ['R',  'B',  'rb', 'yb', 'B',  'Y'],
                    ['R',  'rb', 'R',  'Y',  'yb', 'Y'],
                    ['G',  'gb', 'G',  'P',  'pb', 'P'],
                    ['G',  'B',  'gb', 'pb', 'B',  'P'],
                    ['G',  'G',  'G',  'P',  'P',  'P']
                ],
                loops: [
                    {
                        id: 'RED',
                        color: 'R',
                        pieceColor: 'Red',
                        dir: 1, // CCW ↺
                        icon: 'fa-rotate-left',
                        title: 'Conga Roja (↺)',
                        bgBtn: 'from-red-500 to-red-600 border-red-300/40 text-white shadow-red-950/80',
                        path: [
                            [0, 0], [0, 1], [0, 2], [1, 2], [2, 2], [2, 1], [2, 0], [1, 0]
                        ]
                    },
                    {
                        id: 'YELLOW',
                        color: 'Y',
                        pieceColor: 'Yellow',
                        dir: -1, // CCW ↺
                        icon: 'fa-rotate-left',
                        title: 'Conga Amarilla (↺)',
                        bgBtn: 'from-amber-400 to-yellow-500 border-yellow-200/50 text-slate-950 shadow-amber-950/80',
                        path: [
                            [3, 0], [4, 0], [5, 0], [5, 1], [5, 2], [4, 2], [3, 2], [3, 1]
                        ]
                    },
                    {
                        id: 'BLUE',
                        color: 'B',
                        pieceColor: 'Blue',
                        dir: 1, // CCW ↺
                        icon: 'fa-rotate-left',
                        title: 'Conga Azul (↺)',
                        bgBtn: 'from-blue-500 to-blue-600 border-blue-300/40 text-white shadow-blue-950/80',
                        path: [
                            [1, 1], [1, 2], [1, 3], [1, 4], [2, 4], [3, 4], [4, 4], [4, 3], [4, 2], [4, 1], [3, 1], [2, 1]
                        ]
                    },
                    {
                        id: 'GREEN',
                        color: 'G',
                        pieceColor: 'Green',
                        dir: 1, // CCW ↺
                        icon: 'fa-rotate-left',
                        title: 'Conga Verde (↺)',
                        bgBtn: 'from-emerald-500 to-green-600 border-green-300/40 text-white shadow-green-950/80',
                        path: [
                            [0, 3], [0, 4], [0, 5], [1, 5], [2, 5], [2, 4], [2, 3], [1, 3]
                        ]
                    },
                    {
                        id: 'PURPLE',
                        color: 'P',
                        pieceColor: 'Purple',
                        dir: -1, // CCW ↺
                        icon: 'fa-rotate-left',
                        title: 'Conga Púrpura (↺)',
                        bgBtn: 'from-purple-500 to-purple-600 border-purple-300/40 text-white shadow-purple-950/80',
                        path: [
                            [3, 3], [4, 3], [5, 3], [5, 4], [5, 5], [4, 5], [3, 5], [3, 4]
                        ]
                    }
                ],
                initialPieces: function() {
                    const pieces = [];
                    this.loops[0].path.forEach(([x, y], idx) => pieces.push({ x, y, piece: { id: `R${idx + 1}`, color: 'Red' } }));
                    this.loops[1].path.forEach(([x, y], idx) => pieces.push({ x, y, piece: { id: `Y${idx + 1}`, color: 'Yellow' } }));
                    this.loops[3].path.forEach(([x, y], idx) => pieces.push({ x, y, piece: { id: `G${idx + 1}`, color: 'Green' } }));
                    this.loops[4].path.forEach(([x, y], idx) => pieces.push({ x, y, piece: { id: `P${idx + 1}`, color: 'Purple' } }));
                    
                    // 4 Blue-only center cells
                    const blueCells = [[1, 1], [4, 1], [1, 4], [4, 4]];
                    blueCells.forEach(([x, y], idx) => {
                        pieces.push({ x, y, piece: { id: `B${idx + 1}`, color: 'Blue' } });
                    });
                    return pieces;
                }
            }
        };

        // Global Game Variables
        let currentLevel = 1;
        let boardState = [];
        let moveCount = 0;
        let isAnimating = false;
        let isScrambling = false;
        let historyStack = [];

        // Generate continuous 3-line parallel vector tracks with smooth 90-degree corner curves
        function createMovementTracksSVG(r, c) {
            const levelConfig = LEVELS[currentLevel];
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.className = 'absolute inset-0 w-full h-full pointer-events-none z-0';

            const OFFSETS = [32, 50, 68]; // Parallel line offsets in SVG 0..100 space

            levelConfig.loops.forEach(loop => {
                const path = loop.path;
                const n = path.length;

                const idx = path.findIndex(([x, y]) => x === c && y === r);
                if (idx === -1) return;

                const [currX, currY] = path[idx];
                const [prevX, prevY] = path[(idx - 1 + n) % n];
                const [nextX, nextY] = path[(idx + 1) % n];

                function getSide(otherX, otherY) {
                    if (otherX < currX) return 'LEFT';
                    if (otherX > currX) return 'RIGHT';
                    if (otherY < currY) return 'TOP';
                    if (otherY > currY) return 'BOTTOM';
                    return null;
                }

                const sides = [
                    getSide(prevX, prevY),
                    getSide(nextX, nextY)
                ];

                const colorHex = TRACK_COLORS[loop.color] || '#64748b';
                const isHoriz = sides.includes('LEFT') && sides.includes('RIGHT');
                const isVert = sides.includes('TOP') && sides.includes('BOTTOM');

                OFFSETS.forEach(o => {
                    const svgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    svgPath.setAttribute('stroke', colorHex);
                    svgPath.setAttribute('stroke-width', '3.8');
                    svgPath.setAttribute('fill', 'none');
                    svgPath.setAttribute('opacity', '0.85');
                    svgPath.setAttribute('stroke-linecap', 'round');

                    if (isHoriz) {
                        svgPath.setAttribute('d', `M 0,${o} L 100,${o}`);
                    } else if (isVert) {
                        svgPath.setAttribute('d', `M ${o},0 L ${o},100`);
                    } else {
                        const hSide = sides.find(s => s === 'LEFT' || s === 'RIGHT');
                        const vSide = sides.find(s => s === 'TOP' || s === 'BOTTOM');

                        if (hSide && vSide) {
                            const hX = hSide === 'LEFT' ? 0 : 100;
                            const vY = vSide === 'TOP' ? 0 : 100;
                            svgPath.setAttribute('d', `M ${hX},${o} Q ${o},${o} ${o},${vY}`);
                        }
                    }

                    svg.appendChild(svgPath);
                });
            });

            return svg;
        }

        function createGridDOM() {
            const gridEl = document.getElementById('board-grid');
            const levelConfig = LEVELS[currentLevel];
            
            gridEl.innerHTML = '';
            gridEl.className = `grid grid-cols-${levelConfig.cols} gap-0 w-full relative rounded-2xl overflow-hidden border border-slate-800/80`;

            for (let r = 0; r < levelConfig.rows; r++) {
                for (let c = 0; c < levelConfig.cols; c++) {
                    const type = levelConfig.cellTypes[r][c];
                    const cellEl = document.createElement('div');
                    let bgClass = `cell-${type}-bg`;

                    cellEl.className = `grid-cell flex items-center justify-center ${bgClass}`;
                    cellEl.id = `cell-${c}-${r}`;

                    const tracksSVG = createMovementTracksSVG(r, c);
                    cellEl.appendChild(tracksSVG);

                    gridEl.appendChild(cellEl);
                }
            }
        }

        function createControlsDOM() {
            const container = document.getElementById('controls-capsule');
            const levelConfig = LEVELS[currentLevel];
            container.innerHTML = '';

            levelConfig.loops.forEach(loop => {
                const btn = document.createElement('button');
                btn.id = `btn-${loop.id.toLowerCase()}`;
                btn.title = loop.title;
                btn.onclick = () => rotateLoop(loop.id);
                btn.className = `w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-br ${loop.bgBtn} shadow-lg hover:scale-105 active:scale-95 transition-all duration-150 flex items-center justify-center border-2 text-xl sm:text-2xl`;
                
                btn.innerHTML = `<i class="fa-solid ${loop.icon}"></i>`;
                container.appendChild(btn);
            });
        }

        function switchLevel(lvl) {
            if (isAnimating || isScrambling) return;
            currentLevel = lvl;

            // Update level tab button styles
            document.getElementById('lvl-1-btn').className = lvl === 1 
                ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md'
                : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-slate-200';

            document.getElementById('lvl-2-btn').className = lvl === 2 
                ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md'
                : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-slate-200';

            createControlsDOM();
            createGridDOM();
            scrambleBoardAnimated();
        }

        function initBoard() {
            const levelConfig = LEVELS[currentLevel];
            boardState = Array(levelConfig.rows).fill(null).map(() => Array(levelConfig.cols).fill(null));
            historyStack = [];

            const initialPieces = levelConfig.initialPieces();
            initialPieces.forEach(({ x, y, piece }) => {
                boardState[y][x] = piece;
            });

            moveCount = 0;
            updateMoveCounter();
            updateUndoButtonState();
            renderBoard();
        }

        function renderBoard() {
            const levelConfig = LEVELS[currentLevel];

            for (let r = 0; r < levelConfig.rows; r++) {
                for (let c = 0; c < levelConfig.cols; c++) {
                    const piece = boardState[r][c];
                    const cellEl = getCellElement(c, r);

                    const existingPiece = cellEl.querySelector('.square-piece');
                    if (existingPiece) {
                        cellEl.removeChild(existingPiece);
                    }

                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `square-piece piece-${piece.color}`;
                        pieceEl.id = `piece-${piece.id}`;
                        cellEl.appendChild(pieceEl);
                    }
                }
            }
        }

        function getCellElement(x, y) {
            return document.getElementById(`cell-${x}-${y}`);
        }

        async function rotateLoop(loopId, overrideDir = null, duration = 220, isUndo = false) {
            if (isAnimating) return;
            isAnimating = true;

            const levelConfig = LEVELS[currentLevel];
            const loopObj = levelConfig.loops.find(l => l.id === loopId);

            if (!loopObj) {
                isAnimating = false;
                return;
            }

            let path = loopObj.path;
            let dir = loopObj.dir;

            if (overrideDir !== null) dir = overrideDir;
            const n = path.length;

            const movePairs = [];
            for (let i = 0; i < n; i++) {
                const [srcX, srcY] = path[i];
                let targetIdx = (i + dir) % n;
                if (targetIdx < 0) targetIdx += n;
                const [tgtX, tgtY] = path[targetIdx];

                const srcCell = getCellElement(srcX, srcY);
                const tgtCell = getCellElement(tgtX, tgtY);
                const pieceEl = srcCell ? srcCell.querySelector('.square-piece') : null;

                if (pieceEl && srcCell && tgtCell) {
                    const srcRect = srcCell.getBoundingClientRect();
                    const tgtRect = tgtCell.getBoundingClientRect();

                    const deltaX = tgtRect.left - srcRect.left;
                    const deltaY = tgtRect.top - srcRect.top;

                    movePairs.push({ pieceEl, tgtCell, deltaX, deltaY });
                }
            }

            movePairs.forEach(({ pieceEl, deltaX, deltaY }) => {
                pieceEl.style.transition = `transform ${duration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                pieceEl.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                pieceEl.style.zIndex = '30';
            });

            await new Promise(resolve => setTimeout(resolve, duration));

            movePairs.forEach(({ pieceEl, tgtCell }) => {
                pieceEl.style.transition = 'none';
                pieceEl.style.transform = 'none';
                pieceEl.style.zIndex = '10';
                tgtCell.appendChild(pieceEl);
            });

            const currentPieces = path.map(([x, y]) => boardState[y][x]);
            const shiftedPieces = new Array(n);

            for (let i = 0; i < n; i++) {
                let targetIdx = (i + dir) % n;
                if (targetIdx < 0) targetIdx += n;
                shiftedPieces[targetIdx] = currentPieces[i];
            }

            path.forEach(([x, y], idx) => {
                boardState[y][x] = shiftedPieces[idx];
            });

            if (!isScrambling && !isUndo) {
                historyStack.push({ loopId, dir });
                moveCount++;
            } else if (isUndo) {
                moveCount = Math.max(0, moveCount - 1);
            }

            isAnimating = false;

            updateMoveCounter();
            updateUndoButtonState();
            checkWinState();
        }

        async function scrambleBoardAnimated() {
            if (isAnimating || isScrambling) return;
            isScrambling = true;
            document.getElementById('win-overlay').classList.add('hidden');
            
            initBoard();
            await new Promise(r => setTimeout(r, 150));

            const levelConfig = LEVELS[currentLevel];
            const loops = levelConfig.loops.map(l => l.id);
            // Increased scramble iterations for thorough mixing across all 5 loops
            const totalScrambleMoves = currentLevel === 1 ? 30 : 65;

            for (let i = 0; i < totalScrambleMoves; i++) {
                const randLoop = loops[Math.floor(Math.random() * loops.length)];
                const randDir = Math.random() < 0.5 ? 1 : -1;
                await rotateLoop(randLoop, randDir, 35);
            }

            moveCount = 0;
            historyStack = [];
            isScrambling = false;
            
            updateMoveCounter();
            updateUndoButtonState();
            checkWinState();
        }

        async function undoMove() {
            if (isAnimating || isScrambling || historyStack.length === 0) return;
            const lastMove = historyStack.pop();
            const reverseDir = -lastMove.dir;
            await rotateLoop(lastMove.loopId, reverseDir, 200, true);
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('btn-undo');
            if (undoBtn) {
                undoBtn.disabled = historyStack.length === 0 || isScrambling || isAnimating;
            }
        }

        function updateMoveCounter() {
            document.getElementById('move-counter').innerText = moveCount;
        }

        function checkWinState() {
            if (isScrambling) return;

            const levelConfig = LEVELS[currentLevel];
            let isWin = true;

            for (let r = 0; r < levelConfig.rows; r++) {
                for (let c = 0; c < levelConfig.cols; c++) {
                    const cellType = levelConfig.cellTypes[r][c].toLowerCase();
                    const piece = boardState[r][c];

                    if (!piece) continue;

                    const colorInitial = piece.color.charAt(0).toLowerCase(); // 'r', 'y', 'b', 'g', 'p'
                    if (!cellType.includes(colorInitial)) {
                        isWin = false;
                        break;
                    }
                }
                if (!isWin) break;
            }

            if (isWin && moveCount > 0 && historyStack.length > 0) {
                document.getElementById('win-overlay').classList.remove('hidden');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R' || e.key === '1') rotateLoop('RED');
            if (e.key === 'y' || e.key === 'Y' || e.key === '2') rotateLoop('YELLOW');
            if (e.key === 'b' || e.key === 'B' || e.key === '3') rotateLoop('BLUE');
            if (currentLevel === 2) {
                if (e.key === 'g' || e.key === 'G' || e.key === '4') rotateLoop('GREEN');
                if (e.key === 'p' || e.key === 'P' || e.key === '5') rotateLoop('PURPLE');
            }
            if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) undoMove();
            if (e.key === 'u' || e.key === 'U') undoMove();
        });

        window.onload = function() {
            createControlsDOM();
            createGridDOM();
            setTimeout(() => {
                scrambleBoardAnimated();
            }, 500);
        };
    </script>
</body>
</html>
