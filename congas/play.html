<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congas - Juego de Circuitos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a12;
            color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Outfit', sans-serif;
        }

        /* Square Board Cell */
        .grid-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            transition: all 0.2s ease;
            box-sizing: border-box;
            border-radius: 0;
            overflow: visible;
        }

        /* Clean Cell Background Tints */
        .cell-R-bg { background-color: rgba(239, 68, 68, 0.06); }
        .cell-Y-bg { background-color: rgba(234, 179, 8, 0.06); }
        .cell-B-bg { background-color: rgba(59, 130, 246, 0.06); }
        .cell-rb-bg { background-color: rgba(168, 85, 247, 0.1); }
        .cell-yb-bg { background-color: rgba(20, 184, 166, 0.1); }

        /* Square Piece - Centered & Smaller than cell */
        .square-piece {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            width: 68%;
            height: 68%;
            border-radius: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            will-change: transform;
            backface-visibility: hidden;
        }

        .piece-Red {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: 2px solid #fca5a5;
        }

        .piece-Yellow {
            background: linear-gradient(135deg, #facc15, #eab308);
            border: 2px solid #fef08a;
        }

        .piece-Blue {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: 2px solid #bfdbfe;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 bg-slate-950 text-slate-100">

    <!-- Top Header Bar -->
    <header class="w-full max-w-5xl flex flex-row items-center justify-between gap-4 mb-3">
        <div>
            <h1 class="text-3xl sm:text-4xl font-black title-font bg-clip-text text-transparent bg-gradient-to-r from-red-500 via-pink-500 to-purple-400 tracking-wide">
                Congas
            </h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
                Rota las congas de colores para devolver cada ficha a su circuito.
            </p>
        </div>

        <div class="flex items-center gap-4 bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-2xl shadow-lg">
            <div class="text-center px-2">
                <span class="text-[10px] text-slate-400 block uppercase font-extrabold tracking-wider">MOVIMIENTOS</span>
                <span id="move-counter" class="text-lg font-black text-amber-400 title-font">0</span>
            </div>
        </div>
    </header>

    <!-- Main Content: Side Panel + Board -->
    <main class="w-full max-w-5xl my-auto flex flex-row items-center justify-center gap-5 sm:gap-8">
        
        <!-- Left Side Control Panel -->
        <div class="shrink-0 flex flex-col gap-3 justify-center items-center">
            
            <!-- Capsule Container with 3 Circular Loop Controls -->
            <div class="bg-slate-900/90 border border-slate-800/80 p-3.5 sm:p-4 rounded-[2.2rem] shadow-xl flex flex-col gap-4 items-center">
                
                <!-- Red Circle Button (Counter-clockwise ↺) -->
                <button id="btn-red" onclick="rotateLoop('RED')" title="Conga Roja (↺)" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-br from-red-500 to-red-600 text-white shadow-lg shadow-red-950/80 hover:scale-105 active:scale-95 transition-all duration-150 flex items-center justify-center border-2 border-red-300/40 text-xl sm:text-2xl">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>

                <!-- Blue Circle Button (Counter-clockwise ↺) -->
                <button id="btn-blue" onclick="rotateLoop('BLUE')" title="Conga Azul (↺)" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 text-white shadow-lg shadow-blue-950/80 hover:scale-105 active:scale-95 transition-all duration-150 flex items-center justify-center border-2 border-blue-300/40 text-xl sm:text-2xl">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>

                <!-- Yellow Circle Button (Clockwise ↻) -->
                <button id="btn-yellow" onclick="rotateLoop('YELLOW')" title="Conga Amarilla (↻)" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-br from-amber-400 to-yellow-500 text-slate-950 shadow-lg shadow-amber-950/80 hover:scale-105 active:scale-95 transition-all duration-150 flex items-center justify-center border-2 border-yellow-200/50 text-xl sm:text-2xl">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>

            </div>

            <!-- Utility Icon Buttons Below Capsule -->
            <div class="flex flex-col gap-2 w-full">
                <button onclick="scrambleBoardAnimated()" title="Mezclar fichas" class="w-full bg-purple-900/30 hover:bg-purple-800/40 text-purple-200 border border-purple-500/30 font-semibold py-2.5 px-3 rounded-xl active:scale-95 flex items-center justify-center transition-all text-sm">
                    <i class="fa-solid fa-shuffle text-purple-400"></i>
                </button>
                <button id="btn-undo" onclick="undoMove()" title="Deshacer último movimiento" class="w-full bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700 font-semibold py-2.5 px-3 rounded-xl active:scale-95 flex items-center justify-center transition-all text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-rotate-left text-slate-400"></i>
                </button>
            </div>

        </div>

        <!-- Right Side: The 6x5 Board Grid -->
        <div class="flex-1 min-w-0 max-w-[580px] flex justify-center">
            <div class="bg-slate-900/90 p-4 sm:p-5 rounded-[2rem] border border-slate-800 shadow-2xl relative w-full">
                
                <!-- Win Overlay -->
                <div id="win-overlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-[2rem] z-30 flex flex-col items-center justify-center p-6 text-center">
                    <i class="fa-solid fa-trophy text-6xl text-amber-400 mb-4 animate-bounce"></i>
                    <h2 class="text-3xl font-black text-white title-font mb-2">¡Completado!</h2>
                    <p class="text-xs sm:text-sm text-slate-300 max-w-xs mb-6">Todas las congas han vuelto a su circuito correspondiente.</p>
                    <button onclick="scrambleBoardAnimated()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-xl active:scale-95 transition-all text-sm">
                        Jugar de Nuevo
                    </button>
                </div>

                <!-- 6x5 Grid Container -->
                <div id="board-grid" class="grid grid-cols-6 gap-0 w-full relative rounded-2xl overflow-hidden border border-slate-800/80">
                    <!-- Dynamic Grid Generated by JS -->
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-[11px] text-slate-500 text-center mt-2">
        Congas &bull; Rojo, Azul, Amarillo
    </footer>

    <!-- JavaScript Game Logic -->
    <script>
        // Grid Dimensions: 6 columns x 5 rows
        const COLS = 6;
        const ROWS = 5;

        // Cell Layout matrix
        const CELL_TYPES = [
            ['R',  'R',  'R',  'Y',  'Y',  'Y'],
            ['R',  'B',  'rb', 'yb', 'B',  'Y'],
            ['R',  'B',  'R',  'Y',  'B',  'Y'],
            ['R',  'B',  'rb', 'yb', 'B',  'Y'],
            ['R',  'R',  'R',  'Y',  'Y',  'Y']
        ];

        // RED LOOP (CCW): 12 cells
        const RED_PATH = [
            [0, 0], [0, 1], [0, 2], [0, 3], [0, 4],
            [1, 4], [2, 4],
            [2, 3], [2, 2], [2, 1],
            [2, 0], [1, 0]
        ];

        // YELLOW LOOP (CW): 12 cells
        const YELLOW_PATH = [
            [3, 0], [4, 0], [5, 0],
            [5, 1], [5, 2], [5, 3], [5, 4],
            [4, 4], [3, 4],
            [3, 3], [3, 2], [3, 1]
        ];

        // BLUE LOOP (CCW): 10 cells
        const BLUE_PATH = [
            [1, 1], [1, 2], [1, 3],
            [2, 3], [3, 3], [4, 3],
            [4, 2], [4, 1],
            [3, 1], [2, 1]
        ];

        // Track Line Colors
        const TRACK_COLORS = {
            'R': '#ef4444',
            'B': '#3b82f6',
            'Y': '#eab308'
        };

        const LOOPS = [
            { color: 'R', path: RED_PATH },
            { color: 'B', path: BLUE_PATH },
            { color: 'Y', path: YELLOW_PATH }
        ];

        // Generate continuous 3-line parallel vector tracks with smooth 90-degree corner curves
        function createMovementTracksSVG(r, c) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.className = 'absolute inset-0 w-full h-full pointer-events-none z-0';

            const OFFSETS = [32, 50, 68]; // Parallel line offsets in SVG 0..100 space

            LOOPS.forEach(loop => {
                const path = loop.path;
                const n = path.length;

                // Check if cell (c, r) belongs to this loop
                const idx = path.findIndex(([x, y]) => x === c && y === r);
                if (idx === -1) return;

                const [currX, currY] = path[idx];
                const [prevX, prevY] = path[(idx - 1 + n) % n];
                const [nextX, nextY] = path[(idx + 1) % n];

                function getSide(otherX, otherY) {
                    if (otherX < currX) return 'LEFT';
                    if (otherX > currX) return 'RIGHT';
                    if (otherY < currY) return 'TOP';
                    if (otherY > currY) return 'BOTTOM';
                    return null;
                }

                const sides = [
                    getSide(prevX, prevY),
                    getSide(nextX, nextY)
                ];

                const colorHex = TRACK_COLORS[loop.color] || '#64748b';

                const isHoriz = sides.includes('LEFT') && sides.includes('RIGHT');
                const isVert = sides.includes('TOP') && sides.includes('BOTTOM');

                OFFSETS.forEach(o => {
                    const svgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    svgPath.setAttribute('stroke', colorHex);
                    svgPath.setAttribute('stroke-width', '3.8');
                    svgPath.setAttribute('fill', 'none');
                    svgPath.setAttribute('opacity', '0.85');
                    svgPath.setAttribute('stroke-linecap', 'round');

                    if (isHoriz) {
                        // Straight Horizontal line
                        svgPath.setAttribute('d', `M 0,${o} L 100,${o}`);
                    } else if (isVert) {
                        // Straight Vertical line
                        svgPath.setAttribute('d', `M ${o},0 L ${o},100`);
                    } else {
                        // Corner Turn! Find the horizontal side and vertical side
                        const hSide = sides.find(s => s === 'LEFT' || s === 'RIGHT');
                        const vSide = sides.find(s => s === 'TOP' || s === 'BOTTOM');

                        if (hSide && vSide) {
                            const hX = hSide === 'LEFT' ? 0 : 100;
                            const vY = vSide === 'TOP' ? 0 : 100;

                            // Smooth 90-degree quadratic arc connecting edge hX to vY through corner anchor (o, o)
                            svgPath.setAttribute('d', `M ${hX},${o} Q ${o},${o} ${o},${vY}`);
                        }
                    }

                    svg.appendChild(svgPath);
                });
            });

            return svg;
        }

        // State Tracking
        let boardState = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        let moveCount = 0;
        let isAnimating = false;
        let isScrambling = false;
        let historyStack = [];

        function createGridDOM() {
            const gridEl = document.getElementById('board-grid');
            if (gridEl.children.length > 0) return; // Grid already exists

            gridEl.innerHTML = '';

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const type = CELL_TYPES[r][c];
                    const cellEl = document.createElement('div');
                    let bgClass = `cell-${type}-bg`;

                    cellEl.className = `grid-cell flex items-center justify-center ${bgClass}`;
                    cellEl.id = `cell-${c}-${r}`;

                    // Add 3 movement track lines SVG (with dynamic curved corner routing)
                    const tracksSVG = createMovementTracksSVG(r, c);
                    cellEl.appendChild(tracksSVG);

                    gridEl.appendChild(cellEl);
                }
            }
        }

        function initBoard() {
            boardState = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            historyStack = [];

            // Fill Red Path with Red square pieces
            RED_PATH.forEach(([x, y], idx) => {
                boardState[y][x] = { id: `R${idx + 1}`, color: 'Red' };
            });

            // Fill Yellow Path with Yellow square pieces
            YELLOW_PATH.forEach(([x, y], idx) => {
                boardState[y][x] = { id: `Y${idx + 1}`, color: 'Yellow' };
            });

            // Fill Blue-only cells with Blue square pieces
            const blueOnlyCells = [
                [1, 1], [1, 2], [1, 3],
                [4, 1], [4, 2], [4, 3]
            ];
            blueOnlyCells.forEach(([x, y], idx) => {
                boardState[y][x] = { id: `B${idx + 1}`, color: 'Blue' };
            });

            moveCount = 0;
            updateMoveCounter();
            updateUndoButtonState();
            renderBoard();
        }

        function renderBoard() {
            createGridDOM();

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const piece = boardState[r][c];
                    const cellEl = getCellElement(c, r);

                    // Remove existing piece if present
                    const existingPiece = cellEl.querySelector('.square-piece');
                    if (existingPiece) {
                        cellEl.removeChild(existingPiece);
                    }

                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `square-piece piece-${piece.color}`;
                        pieceEl.id = `piece-${piece.id}`;
                        cellEl.appendChild(pieceEl);
                    }
                }
            }
        }

        function getCellElement(x, y) {
            return document.getElementById(`cell-${x}-${y}`);
        }

        async function rotateLoop(loopColor, overrideDir = null, duration = 220, isUndo = false) {
            if (isAnimating) return;
            isAnimating = true;

            let path = [];
            let dir = 1; // Default CCW for Red and Blue

            if (loopColor === 'RED') { path = RED_PATH; dir = 1; }
            else if (loopColor === 'BLUE') { path = BLUE_PATH; dir = 1; }
            else if (loopColor === 'YELLOW') { path = YELLOW_PATH; dir = 1; } // CW for Yellow

            if (overrideDir !== null) dir = overrideDir;
            if (path.length === 0) {
                isAnimating = false;
                updateUndoButtonState();
                return;
            }

            const n = path.length;

            // Prepare transition displacements for piece elements
            const movePairs = [];
            for (let i = 0; i < n; i++) {
                const [srcX, srcY] = path[i];
                let targetIdx = (i + dir) % n;
                if (targetIdx < 0) targetIdx += n;
                const [tgtX, tgtY] = path[targetIdx];

                const srcCell = getCellElement(srcX, srcY);
                const tgtCell = getCellElement(tgtX, tgtY);
                const pieceEl = srcCell ? srcCell.querySelector('.square-piece') : null;

                if (pieceEl && srcCell && tgtCell) {
                    const srcRect = srcCell.getBoundingClientRect();
                    const tgtRect = tgtCell.getBoundingClientRect();

                    const deltaX = tgtRect.left - srcRect.left;
                    const deltaY = tgtRect.top - srcRect.top;

                    movePairs.push({ pieceEl, tgtCell, deltaX, deltaY });
                }
            }

            // Apply transition animation
            movePairs.forEach(({ pieceEl, deltaX, deltaY }) => {
                pieceEl.style.transition = `transform ${duration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                pieceEl.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                pieceEl.style.zIndex = '30';
            });

            // Wait for animation to finish
            await new Promise(resolve => setTimeout(resolve, duration));

            // Re-parent pieces smoothly without tearing or rebuilding DOM
            movePairs.forEach(({ pieceEl, tgtCell }) => {
                pieceEl.style.transition = 'none';
                pieceEl.style.transform = 'none';
                pieceEl.style.zIndex = '10';
                tgtCell.appendChild(pieceEl);
            });

            // Shift internal board array state
            const currentPieces = path.map(([x, y]) => boardState[y][x]);
            const shiftedPieces = new Array(n);

            for (let i = 0; i < n; i++) {
                let targetIdx = (i + dir) % n;
                if (targetIdx < 0) targetIdx += n;
                shiftedPieces[targetIdx] = currentPieces[i];
            }

            path.forEach(([x, y], idx) => {
                boardState[y][x] = shiftedPieces[idx];
            });

            if (!isScrambling && !isUndo) {
                historyStack.push({ loopColor, dir });
                moveCount++;
            } else if (isUndo) {
                moveCount = Math.max(0, moveCount - 1);
            }

            // Mark animation finished
            isAnimating = false;

            updateMoveCounter();
            updateUndoButtonState();
            checkWinState();
        }

        // Animated Fast Scramble sequence
        async function scrambleBoardAnimated() {
            if (isAnimating || isScrambling) return;
            isScrambling = true;
            document.getElementById('win-overlay').classList.add('hidden');
            
            initBoard();
            await new Promise(r => setTimeout(r, 150));

            const loops = ['RED', 'BLUE', 'YELLOW'];
            const totalScrambleMoves = 24;

            for (let i = 0; i < totalScrambleMoves; i++) {
                const randLoop = loops[Math.floor(Math.random() * loops.length)];
                await rotateLoop(randLoop, null, 60); // Fast 60ms step animation
            }

            moveCount = 0;
            historyStack = [];
            isScrambling = false;
            
            updateMoveCounter();
            updateUndoButtonState();
            checkWinState();
        }

        async function undoMove() {
            if (isAnimating || isScrambling || historyStack.length === 0) return;
            const lastMove = historyStack.pop();
            const reverseDir = -lastMove.dir;
            await rotateLoop(lastMove.loopColor, reverseDir, 200, true);
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('btn-undo');
            if (undoBtn) {
                undoBtn.disabled = historyStack.length === 0 || isScrambling || isAnimating;
            }
        }

        function updateMoveCounter() {
            document.getElementById('move-counter').innerText = moveCount;
        }

        function checkWinState() {
            if (isScrambling) return;

            let isWin = true;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cellType = CELL_TYPES[r][c];
                    const piece = boardState[r][c];

                    if (!piece) continue;

                    if (piece.color === 'Red') {
                        if (cellType !== 'R' && cellType !== 'rb') isWin = false;
                    } else if (piece.color === 'Yellow') {
                        if (cellType !== 'Y' && cellType !== 'yb') isWin = false;
                    } else if (piece.color === 'Blue') {
                        if (cellType !== 'B' && cellType !== 'rb' && cellType !== 'yb') isWin = false;
                    }
                }
            }

            if (isWin && moveCount > 0 && historyStack.length > 0) {
                document.getElementById('win-overlay').classList.remove('hidden');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R' || e.key === '1') rotateLoop('RED');
            if (e.key === 'b' || e.key === 'B' || e.key === '2') rotateLoop('BLUE');
            if (e.key === 'y' || e.key === 'Y' || e.key === '3') rotateLoop('YELLOW');
            if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) undoMove();
            if (e.key === 'u' || e.key === 'U') undoMove();
        });

        // Initialize on load and start scramble animation
        window.onload = function() {
            initBoard();
            setTimeout(() => {
                scrambleBoardAnimated();
            }, 500);
        };
    </script>
</body>
</html>
